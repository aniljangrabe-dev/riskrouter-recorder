[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "riskrouter-recorder"
version = "0.2.0"
description = "Evidence from where decisions are already logged: keep each record in your own journal, send only its salted digest to a RiskRouter-compatible evidence log."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Specification = "https://riskrouter.eu/spec#records"
Documentation = "https://riskrouter.eu/integrate#recorders"
Source = "https://github.com/aniljangrabe-dev/riskrouter-recorder"
Issues = "https://github.com/aniljangrabe-dev/riskrouter-recorder/issues"
